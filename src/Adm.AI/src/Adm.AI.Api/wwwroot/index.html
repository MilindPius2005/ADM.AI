<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADM.AI — SDS Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2e3147;
      --primary: #4f6ef7;
      --primary-hover: #3d5ce6;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .main-content {
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .layout-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 2rem;
      align-items: start;
    }
    .upload-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      position: sticky;
      top: 2rem;
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255,255,255,0.02);
    }
    .drop-zone.drag-active {
      border-color: var(--primary);
      background: rgba(79, 110, 247, 0.1);
    }
    .drop-icon { font-size: 2.5rem; margin-bottom: 0.5rem; opacity: 0.8; }
    .drop-text { font-weight: 500; font-size: 0.95rem; }
    .drop-subtext { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.25rem; }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner {
      display: none;
      width: 1rem; height: 1rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .btn.loading .spinner { display: inline-block; }
    .btn.loading .btn-text { opacity: 0.8; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
    }
    .status-msg.error { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: var(--error); }
    .status-msg.success { background: rgba(34, 197, 94, 0.1); border: 1px solid var(--success); color: var(--success); }
    .status-msg.warning { background: rgba(234, 179, 8, 0.1); border: 1px solid var(--warning); color: var(--warning); }
    
    .history-section { margin-top: 2rem; display: none; }
    .history-list { list-style: none; }
  </style>
</head>
<body>
  <header>
    <h1>ADM.AI</h1>
    <div style="color:var(--text-dim);font-size:0.9rem">Batch Ingestion</div>
  </header>

  <main class="main-content">
    <div class="layout-grid">
      <div class="upload-panel">
        <h2 style="font-size:1.1rem;font-weight:600;margin-bottom:1rem">Upload SDS Documents</h2>
        
        <div class="drop-zone" id="dropZone">
          <div class="drop-icon">📄</div>
          <div class="drop-text">Drag & drop PDFs here</div>
          <div class="drop-subtext">or click to browse (up to 10 files)</div>
          <input type="file" id="fileInput" accept=".pdf" multiple style="display:none">
        </div>

        <div id="fileList" class="file-list" style="margin-top: 1rem; display: none;"></div>

        <button id="analyzeBtn" class="btn" style="width:100%;margin-top:1rem;display:none;">
          <div class="btn-text">Analyze All</div>
          <div class="spinner"></div>
        </button>

        <div id="statusMessage" class="status-msg"></div>

        <div class="history-section" id="historySection">
          <h3 style="font-size:0.9rem;color:var(--text-dim);margin-bottom:0.75rem;text-transform:uppercase;letter-spacing:0.05em;">Recent Analyses</h3>
          <ul class="history-list" id="historyList"></ul>
        </div>
      </div>

      <div class="results-panel" id="resultsPanel" style="display:none"></div>
    </div>
  </main>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const analyzeBtnText = analyzeBtn.querySelector('.btn-text');
  const statusMsg = document.getElementById('statusMessage');
  const resultsPanel = document.getElementById('resultsPanel');
  const historySection = document.getElementById('historySection');
  const historyList = document.getElementById('historyList');

  let selectedFiles = [];
  let history = [];

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
  ['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, () => dropZone.classList.add('drag-active')));
  ['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, () => dropZone.classList.remove('drag-active')));

  dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  function handleFiles(files) {
    if (!files.length) return;
    const newFiles = Array.from(files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
    if (!newFiles.length) {
      showStatus('error', 'Only PDF files are supported.');
      return;
    }
    if (selectedFiles.length + newFiles.length > 10) {
      showStatus('error', 'Maximum batch size is 10 files.');
      return;
    }
    selectedFiles.push(...newFiles);
    renderFileList();
  }

  function renderFileList() {
    if (selectedFiles.length === 0) {
      fileList.style.display = 'none';
      analyzeBtn.style.display = 'none';
      return;
    }
    fileList.style.display = 'block';
    analyzeBtn.style.display = 'flex';
    
    fileList.innerHTML = selectedFiles.map((f, i) => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0.5rem;background:var(--surface);border:1px solid var(--border);border-radius:4px;margin-bottom:0.5rem;font-size:0.85rem;">
        <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:1rem;">📄 ${esc(f.name)} <span style="color:var(--text-dim)">(${formatBytes(f.size)})</span></div>
        <div id="file-status-${i}" style="display:none;font-size:0.75rem;padding:2px 6px;border-radius:4px;"></div>
        <button onclick="removeFile(${i})" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:1.1rem;padding:0 5px;" class="remove-btn">×</button>
      </div>
    `).join('');
    
    analyzeBtnText.textContent = `Analyze ${selectedFiles.length} file${selectedFiles.length > 1 ? 's' : ''}`;
    clearStatus();
  }

  window.removeFile = function(index) {
    selectedFiles.splice(index, 1);
    renderFileList();
  };

  function updateFileStatus(index, status, text, isCache) {
    const badge = document.getElementById(`file-status-${index}`);
    if (!badge) return;
    badge.style.display = 'block';
    badge.textContent = text;
    badge.style.backgroundColor = 'transparent';
    badge.style.color = 'var(--text)';
    
    if (status === 'processing') {
      badge.style.color = 'var(--primary)';
    } else if (status === 'success') {
      badge.style.color = 'var(--success)';
      badge.style.backgroundColor = isCache ? 'rgba(234, 179, 8, 0.1)' : 'rgba(34, 197, 94, 0.1)';
      if (isCache) badge.style.color = 'var(--warning)';
    } else if (status === 'error') {
      badge.style.color = 'var(--error)';
      badge.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
    }
  }

  analyzeBtn.addEventListener('click', async () => {
    if (!selectedFiles.length) return;
    analyzeBtn.classList.add('loading');
    analyzeBtn.disabled = true;
    document.querySelectorAll('.remove-btn').forEach(b => b.style.display = 'none');
    clearStatus();
    resultsPanel.innerHTML = '';
    resultsPanel.style.display = 'none';

    selectedFiles.forEach((_, i) => updateFileStatus(i, 'processing', 'Processing...'));
    const formData = new FormData();
    selectedFiles.forEach(f => formData.append('files', f));

    try {
      const res = await fetch('/api/sds/analyze', { method: 'POST', body: formData });
      const json = await res.json();
      
      let batchResults = [];
      let batchSummary = "";

      if (json.results) {
        batchResults = json.results;
        const totalMs = json.totalProcessingTimeMs || 0;
        batchSummary = `Batch completed: ${json.successful} success, ${json.failed} failed in ${(totalMs/1000).toFixed(1)}s`;
        if (json.failed > 0) showStatus('error', batchSummary);
        else showStatus('success', batchSummary);
      } else {
        const totalMs = json.data?.processingTimeMs || 0;
        batchResults = [{
          fileName: selectedFiles[0].name,
          success: json.success,
          fromCache: json.fromCache,
          data: json.data,
          error: json.error,
          processingTimeMs: totalMs
        }];
        if (!json.success) showStatus('error', json.error?.message || 'Error processing file');
        else showStatus('success', `Completed in ${(totalMs/1000).toFixed(1)}s`);
      }

      batchResults.forEach((r, idx) => {
        if (r.success) {
          updateFileStatus(idx, 'success', r.fromCache ? 'Cached' : 'Completed', r.fromCache);
          if (r.data) addToHistory(r.data, r.fileName);
        } else {
          updateFileStatus(idx, 'error', r.error?.message || 'Failed');
        }
      });
      renderBatchResults(batchResults);

    } catch (err) {
      showStatus('error', 'Network error or server unavailable.');
      selectedFiles.forEach((_, i) => updateFileStatus(i, 'error', 'Failed'));
    } finally {
      analyzeBtn.classList.remove('loading');
      analyzeBtn.disabled = false;
      document.querySelectorAll('.remove-btn').forEach(b => b.style.display = 'block');
    }
  });

  function showStatus(type, msg) {
    statusMsg.textContent = msg;
    statusMsg.className = 'status-msg ' + type;
    statusMsg.style.display = 'block';
  }
  function clearStatus() {
    statusMsg.style.display = 'none';
  }

  function renderBatchResults(results) {
    if (!results || !results.length) return;
    resultsPanel.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)">
        <h2 style="font-size:1.25rem;font-weight:600;">Analysis Results</h2>
      </div>
      <div style="display:flex;flex-direction:column;gap:1rem;">
        ${results.map((r) => {
          if (!r.success) {
             return `<div style="padding:1rem;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--error);border-radius:6px;">
               <div style="font-weight:600;margin-bottom:0.5rem">${esc(r.fileName)}</div>
               <div style="color:var(--error);font-size:0.85rem">${esc(r.error?.message || 'Unknown error')}</div>
             </div>`;
          }
          const data = r.data;
          const ex = data.extractionResult;
          if (!ex) return '';
          return `
            <details style="background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;" ${results.length === 1 ? 'open' : ''}>
              <summary style="padding:1rem;font-weight:600;cursor:pointer;background:rgba(0,0,0,0.02);display:flex;justify-content:space-between;align-items:center;">
                <div>📄 ${esc(r.fileName)}</div>
                <div style="display:flex;gap:0.5rem;">
                  ${r.fromCache ? '<span style="padding:2px 6px;border-radius:4px;font-size:0.7rem;color:var(--warning);background:rgba(234,179,8,0.1)">Cached</span>' : ''}
                  <span style="padding:2px 6px;border-radius:4px;background:rgba(0,0,0,0.2);font-size:0.7rem;">${((r.processingTimeMs||0)/1000).toFixed(1)}s</span>
                </div>
              </summary>
              <div style="padding:1rem;border-top:1px solid var(--border);">
                <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1.5rem">
                  ${pill('Status', data.status)}
                  ${pill('Model', data.openAiModel)}
                  ${pill('Tokens', data.totalTokens)}
                  ${pill('Cost', '$' + (data.estimatedCostUsd || 0).toFixed(5))}
                </div>
                ${renderSdsSections(ex)}
              </div>
            </details>
          `;
        }).join('')}
      </div>
    `;
    resultsPanel.style.display = 'block';
  }

  
  
  function renderSdsSections(ex) {
    const sections = [];

    if (ex.chemicalName || ex.productIdentifier || ex.casNumber) {
      sections.push(sec('🏷️ Identification', [
        fld('Chemical Name', ex.chemicalName), fld('Product Identifier', ex.productIdentifier),
        fld('CAS Number', ex.casNumber), fld('UN Number', ex.unNumber),
        fld('Recommended Use', ex.recommendedUse),
        ...contact('Manufacturer', ex.manufacturer),
        ...contact('Supplier', ex.supplier),
        fld('Emergency Phone', ex.emergencyPhone)
      ]));
    }

    if (ex.signalWord || ex.hazardClassification || ex.hazardStatements?.length || ex.pictograms?.length) {
      sections.push(sec('⚠️ Hazard Identification', [
        fld('Signal Word', ex.signalWord), fld('Classification', ex.hazardClassification),
        ...codedFld('Hazard Statements', ex.hazardStatements),
        ...codedFld('Precautionary', ex.precautionaryStatements),
        ...(ex.pictograms?.length ? [{ html: '<div style="grid-column:1/-1"><div style="font-size:0.75rem;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.25rem;">GHS Pictograms (Vision Detected)</div>' + ex.pictograms.map(p => '<div style="display:inline-flex;align-items:center;background:rgba(239,68,68,0.1);color:var(--error);padding:0.25rem 0.5rem;border-radius:4px;font-size:0.85rem;margin-right:0.5rem;margin-bottom:0.5rem;font-weight:600;"><span style="margin-right:4px;">' + esc(p.ghsCode || '') + '</span>' + esc(p.name || '') + '</div>').join('') + '</div>' }] : [])
      ]));
    }

    if (ex.composition?.length) {
      sections.push(sec('🧪 Composition', [compTable(ex.composition)]));
    }

    if (ex.firstAidMeasures) {
      const fa = ex.firstAidMeasures;
      sections.push(sec('⚕️ First Aid Measures', [
        fld('Inhalation', fa.inhalation), fld('Skin Contact', fa.skinContact),
        fld('Eye Contact', fa.eyeContact), fld('Ingestion', fa.ingestion),
        fld('Notes', fa.notes)
      ]));
    }

    if (ex.fireFightingMeasures) {
      const ff = ex.fireFightingMeasures;
      sections.push(sec('🔥 Fire-Fighting Measures', [
        fld('Suitable Extinguishing', ff.suitableExtinguishingMedia),
        fld('Unsuitable Extinguishing', ff.unsuitableExtinguishingMedia),
        fld('Special Hazards', ff.specialHazards),
        fld('Protective Equipment', ff.protectiveEquipment),
      ]));
    }

    if (ex.accidentalReleaseMeasures) {
      const ar = ex.accidentalReleaseMeasures;
      sections.push(sec('🚧 Accidental Release', [
        fld('Personal Precautions', ar.personalPrecautions),
        fld('Environmental Precautions', ar.environmentalPrecautions),
        fld('Containment Methods', ar.containmentMethods),
        fld('Cleanup Methods', ar.cleanupMethods),
      ]));
    }

    if (ex.handlingStorage) {
      const hs = ex.handlingStorage;
      sections.push(sec('📦 Handling & Storage', [
        fld('Handling Precautions', hs.handlingPrecautions),
        fld('Storage Conditions', hs.storageConditions),
        fld('Incompatible Materials', hs.incompatibleMaterials),
      ]));
    }

    if (ex.exposureControls || ex.ppe) {
      const ec = ex.exposureControls;
      const ppe = ex.ppe;
      sections.push(sec('🛡️ Exposure Controls & PPE', [
        ...(ec?.occupationalExposureLimits?.length ? [oelTable(ec.occupationalExposureLimits)] : []),
        fld('Engineering Controls', ec?.engineeringControls),
        fld('Eye/Face', ppe?.eye), fld('Skin/Body', ppe?.skin),
        fld('Hands', ppe?.hand), fld('Respiratory', ppe?.respiratory),
        fld('Other/Hygiene', ppe?.other),
      ]));
    }

    if (ex.physicalProperties) {
      const p = ex.physicalProperties;
      sections.push(sec('📏 Physical & Chemical Properties', [
        fld('Appearance', p.appearance), fld('Odor', p.odor),
        fld('pH', p.pH), fld('Melting Point', p.meltingPoint),
        fld('Boiling Point', p.boilingPoint), fld('Flash Point', p.flashPoint),
        fld('Flammability', p.flammability), fld('Vapor Pressure', p.vaporPressure),
        fld('Specific Gravity', p.specificGravity), fld('Solubility', p.solubility),
      ]));
    }

    if (ex.stabilityReactivity) {
      const sr = ex.stabilityReactivity;
      sections.push(sec('⚖️ Stability & Reactivity', [
        fld('Stability', sr.stability), fld('Conditions to Avoid', sr.conditionsToAvoid),
        fld('Incompatible Materials', sr.incompatibleMaterials),
        fld('Decomposition Products', sr.hazardousDecompositionProducts),
      ]));
    }

    if (ex.toxicologicalInformation) {
      const t = ex.toxicologicalInformation;
      sections.push(sec('🧬 Toxicological Information', [
        fld('Acute Toxicity', t.acuteToxicity), fld('Skin Corrosion', t.skinCorrosion),
        fld('Eye Damage', t.eyeDamage), fld('Sensitization', t.sensitization),
        fld('Mutagenicity', t.mutagenicity), fld('Carcinogenicity', t.carcinogenicity),
        fld('Reproductive Toxicity', t.reproductiveToxicity), fld('Organ Toxicity', t.organToxicity),
        fld('Aspiration Hazard', t.aspirationHazard), fld('Notes', t.additionalNotes),
      ]));
    }

    if (ex.ecologicalInformation) {
      const e = ex.ecologicalInformation;
      sections.push(sec('🌱 Ecological Information', [
        fld('Aquatic Toxicity', e.aquaticToxicity), fld('Persistence', e.persistence),
        fld('Bioaccumulation', e.bioaccumulation), fld('Mobility', e.mobility),
        fld('Other Effects', e.otherEffects),
      ]));
    }

    if (ex.disposalConsiderations) {
      const dis = ex.disposalConsiderations;
      sections.push(sec('🗑️ Disposal Considerations', [
        fld('Disposal Methods', dis.disposalMethods),
        fld('Contaminated Packaging', dis.contaminatedPackaging),
        fld('Special Precautions', dis.specialPrecautions),
      ]));
    }

    if (ex.transportInformation) {
      const tr = ex.transportInformation;
      sections.push(sec('🚛 Transport Information', [
        fld('UN Number', tr.unNumber), fld('Proper Shipping Name', tr.properShippingName),
        fld('Hazard Class', tr.hazardClass), fld('Packing Group', tr.packingGroup),
        fld('Environmental Hazard', tr.environmentalHazard),
        fld('Special Precautions', tr.specialPrecautions),
      ]));
    }

    if (ex.regulatoryInformation) {
      const reg = ex.regulatoryInformation;
      sections.push(sec('📋 Regulatory Information', [
        fld('US Regulations', reg.usRegulations), fld('EU Regulations', reg.euRegulations),
        fld('Other Regulations', reg.otherRegulations), fld('Inventory Status', reg.inventoryStatus),
      ]));
    }

    if (ex.confidence) {
      const c = ex.confidence;
      const lvl = (c.overallConfidence ?? '').toLowerCase();
      const color = lvl === 'high' ? 'var(--success)' : lvl === 'medium' ? 'var(--warning)' : 'var(--error)';
      const bg = lvl === 'high' ? 'rgba(34,197,94,0.1)' : lvl === 'medium' ? 'rgba(234,179,8,0.1)' : 'rgba(239,68,68,0.1)';
      sections.push(sec('📊 Confidence', [
        { html: '<div style="font-size:0.9rem;"><div style="font-size:0.75rem;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.25rem;">Overall</div><span style="padding:2px 6px;border-radius:4px;color:' + color + ';background:' + bg + ';">' + esc(c.overallConfidence ?? 'N/A') + '</span></div>' },
        fld('Notes', c.overallNotes),
      ]));
    }

    return '<div style="display:flex;flex-direction:column;gap:1.5rem;">' + sections.join('') + '</div>';
  }

  function sec(title, fields) {
    const body = fields.map(f => f?.html ?? '').join('');
    if (!body.trim()) return '';
    return '<div style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:1rem;"><div style="font-weight:600;margin-bottom:1rem;color:var(--primary);">' + title + '</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;">' + body + '</div></div>';
  }

  function fld(label, value) {
    const val = (value !== null && value !== undefined && String(value).trim() !== '')
      ? '<div style="font-size:0.9rem;">' + esc(String(value)) + '</div>'
      : '<div style="font-size:0.9rem;color:var(--text-dim);font-style:italic;">Not available</div>';
    return { html: '<div><div style="font-size:0.75rem;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.25rem;">' + label + '</div>' + val + '</div>' };
  }
  
  function codedFld(label, arr) {
    if (!arr?.length) return [fld(label, null)];
    const items = arr.map(s =>
      '<div style="display:flex;gap:0.5rem;font-size:0.85rem;margin-bottom:0.25rem;">' + (s.code ? '<span style="background:rgba(0,0,0,0.2);padding:1px 4px;border-radius:3px;font-family:monospace;color:var(--text-dim)">' + esc(s.code) + '</span>' : '') + '<span>' + esc(s.statement ?? '') + '</span></div>'
    ).join('');
    return [{ html: '<div style="grid-column:1/-1"><div style="font-size:0.75rem;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.25rem;">' + label + '</div>' + items + '</div>' }];
  }

  function contact(label, c) {
    if (!c) return [fld(label, null)];
    return [fld(label + ' Name', c.name), fld(label + ' Address', c.address), fld(label + ' Phone', c.phone), fld(label + ' Email', c.email)];
  }

  function compTable(arr) {
    const rows = arr.map(c =>
      '<div style="display:flex;align-items:center;padding:0.25rem 0;border-bottom:1px solid var(--border);font-size:0.85rem;"><span style="width:100px;font-family:monospace;color:var(--text-dim)">' + esc(c.casNumber ?? 'No CAS') + '</span><span style="flex:1;">' + esc(c.name) + '</span>' +
      (c.concentration ? '<span style="color:var(--text-dim);">' + esc(c.concentration) + '</span>' : '') + '</div>'
    ).join('');
    return { html: '<div style="grid-column:1/-1"><div style="font-size:0.75rem;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.5rem;">Components</div>' + rows + '</div>' };
  }

  function oelTable(limits) {
    const rows = limits.map(l =>
      '<div style="display:flex;align-items:center;padding:0.25rem 0;border-bottom:1px solid var(--border);font-size:0.85rem;"><span style="width:100px;font-family:monospace;color:var(--text-dim)">' + esc(l.limitType ?? 'OEL') + '</span><span style="flex:1;">' + esc(l.substance) + '</span>' +
      (l.value ? '<span style="color:var(--text-dim);">' + esc(l.value) + '</span>' : '') + '</div>'
    ).join('');
    return { html: '<div style="grid-column:1/-1"><div style="font-size:0.75rem;text-transform:uppercase;color:var(--text-dim);margin-bottom:0.5rem;">Occupational Exposure Limits</div>' + rows + '</div>' };
  }

  function pill(label, value) {
    return '<div style="display:inline-flex;align-items:center;background:rgba(0,0,0,0.2);padding:0.25rem 0.5rem;border-radius:4px;font-size:0.75rem;color:var(--text-dim);">' + label + ': <span style="margin-left:4px;font-weight:600;color:var(--text)">' + esc(String(value)) + '</span></div>';
  }

  function addToHistory(data, fileName) {
    history.unshift({ data, fileName, at: new Date() });
    renderHistory();
  }
  function renderHistory() {
    if (!history.length) return;
    historySection.style.display = 'block';
    historyList.innerHTML = history.slice(0, 10).map((e, i) =>
      '<li data-idx="' + i + '" style="padding:0.75rem;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:0.75rem;">' +
      '<div>📄</div>' +
      '<div style="flex:1;overflow:hidden;"><div style="font-size:0.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(e.fileName) + '</div>' +
      '<div style="font-size:0.7rem;color:var(--text-dim)">' + esc((e.data.analysisId ?? '').slice(0, 18)) + '…</div></div>' +
      '<div style="font-size:0.7rem;color:var(--text-dim);white-space:nowrap;">' + relTime(e.at) + '</div></li>'
    ).join('');
    historyList.querySelectorAll('li').forEach(el => {
      el.addEventListener('click', () => {
        const entry = history[parseInt(el.dataset.idx)];
        clearStatus();
        renderBatchResults([{ fileName: entry.fileName, success: true, fromCache: true, data: entry.data, processingTimeMs: 0 }]);
      });
    });
  }

  function formatBytes(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    return (b/1048576).toFixed(2) + ' MB';
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function relTime(d) {
    const s = Math.floor((Date.now()-d)/1000);
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    return Math.floor(s/3600) + 'h ago';
  }
</script>
</body>
</html>
